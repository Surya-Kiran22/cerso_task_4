# Blueprint Render deployment specification for Student Management System
# SINGLE Full-Stack Web Service (Express API + Built React Client)
services:
  - type: web
    name: student-management-system
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        value: '*'
